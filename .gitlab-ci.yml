stages:
  - test
  - hardware-test

# Fast: does every config evaluate & build at all? Runs on every push.
build-config:
  stage: test
  image: nixos/nix:latest
  before_script:
    - mkdir -p ~/.config/nix
    - echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
  script:
    - nix build .#vm-test

# Slow: does each REAL host's disk layout actually partition, format,
# and boot? Builds + boot-tests a disposable image per host, using the
# host list from the flake itself (flake.nix's `hostNames` output) —
# add a host to flake.nix's `hosts` attrset and this job covers it
# automatically, no CI file changes needed.
#
# Runs on every branch, every push — feature branches here are
# short-lived and deleted after merge, so disk/boot regressions need to
# surface before merge, not just on main.
disko-boot-test:
  stage: hardware-test
  image: nixos/nix:latest
  before_script:
    - mkdir -p ~/.config/nix
    - echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
    - nix profile install nixpkgs#qemu nixpkgs#jq
  script:
    - |
      HOSTS=$(nix eval --json .#hostNames | jq -r '.[]')
      for host in $HOSTS; do
        echo "=== Testing $host ==="
        bash scripts/testingmodule_disko.sh "$host"
      done
  timeout: 90m
